<svg width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b1f"/>
      <stop offset="100%" style="stop-color:#1a7a35"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e6f7ec"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="160" rx="20" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="30" cy="35" r="18" fill="rgba(255,255,255,0.04)"/>
  <circle cx="370" cy="130" r="25" fill="rgba(255,255,255,0.04)"/>
  <circle cx="55" cy="135" r="12" fill="rgba(255,255,255,0.03)"/>
  <circle cx="350" cy="30" r="14" fill="rgba(255,255,255,0.04)"/>

  <!-- ── CART ICON ── -->
  <!-- Handle bar -->
  <rect x="42" y="28" width="80" height="11" rx="5.5" fill="url(#cartGrad)" stroke="#c8e6c9" stroke-width="1"/>
  <!-- Handle poles -->
  <rect x="42" y="35" width="7" height="16" rx="3" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="115" y="35" width="7" height="16" rx="3" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <!-- Cart body -->
  <rect x="42" y="46" width="80" height="56" rx="7" fill="url(#cartGrad)" stroke="#c8e6c9" stroke-width="1"/>
  <!-- Grid lines horizontal -->
  <line x1="42" y1="65" x2="122" y2="65" stroke="#c8e6c9" stroke-width="0.8"/>
  <line x1="42" y1="83" x2="122" y2="83" stroke="#c8e6c9" stroke-width="0.8"/>
  <!-- Grid lines vertical -->
  <line x1="68" y1="46" x2="68" y2="102" stroke="#c8e6c9" stroke-width="0.8"/>
  <line x1="95" y1="46" x2="95" y2="102" stroke="#c8e6c9" stroke-width="0.8"/>
  <!-- Wheels -->
  <circle cx="62" cy="112" r="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1.5"/>
  <circle cx="62" cy="112" r="3.5" fill="#4caf50"/>
  <circle cx="102" cy="112" r="8" fill="#1b5e20" stroke="#4caf50" stroke-width="1.5"/>
  <circle cx="102" cy="112" r="3.5" fill="#4caf50"/>

  <!-- Leaf on cart -->
  <path d="M108 46 Q120 28 138 34 Q128 50 110 50 Z" fill="url(#leafGrad)"/>
  <path d="M108 46 Q122 38 138 34" fill="none" stroke="#1b5e20" stroke-width="0.8"/>

  <!-- Apple decoration -->
  <circle cx="25" cy="82" r="16" fill="#e53935" stroke="#b71c1c" stroke-width="0.8"/>
  <path d="M25 66 Q31 58 35 63" fill="none" stroke="#388e3c" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M25 63 Q27 57 31 55" fill="none" stroke="#4e342e" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="20" cy="77" rx="4" ry="6" fill="rgba(255,255,255,0.18)" transform="rotate(-20,20,77)"/>

  <!-- Carrot decoration -->
  <path d="M158 38 Q166 52 160 78" fill="#ef6c00" stroke="none"/>
  <path d="M158 38 Q168 54 162 78 Q164 55 172 40 Z" fill="#ffa726"/>
  <path d="M159 40 Q153 26 150 19" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M160 38 Q159 22 158 15" fill="none" stroke="#388e3c" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M161 40 Q168 26 171 20" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ── BRAND TEXT ── -->
  <text x="195" y="88" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Fresh</text>
  <text x="330" y="88" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffd54f" letter-spacing="-1">Cart</text>

  <!-- Tagline -->
  <text x="200" y="118" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.60)" letter-spacing="2.5">FRESH GROCERIES ONLINE</text>

  <!-- Separator line -->
  <line x1="185" y1="96" x2="392" y2="96" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>

  <!-- Dot accents -->
  <circle cx="193" cy="117" r="1.5" fill="rgba(255,213,79,0.5)"/>
  <circle cx="388" cy="117" r="1.5" fill="rgba(255,213,79,0.5)"/>
</svg>
